name: WhatsApp health check

# Vercel Hobby plan only allows daily cron jobs (vercel.json), but we need to
# detect an Evolution/Baileys outage within ~30 min, not once a day. GitHub
# Actions has no such restriction, so we poll the existing
# /api/cron/wa-health route from here instead.
#
# Requires the repository secrets:
#   CRON_SECRET   — same value as the Vercel env var (Settings → Secrets and
#                   variables → Actions → New repository secret).
#   SITE_URL      — optional override; defaults to the known production URL.
# If CRON_SECRET is absent the job is skipped, so the workflow never fails
# noisily before it is configured.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: wa-health-check
  cancel-in-progress: true

jobs:
  check:
    name: Ping wa-health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Guard — secret present
        id: guard
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "CRON_SECRET not set; skipping health check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Call /api/cron/wa-health
        if: steps.guard.outputs.run == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://torneig-local-padel-2026-vinroma.vercel.app' }}
        run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/wa-health"
